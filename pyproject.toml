[project]
name = "simulacra"
version = "0.1.0"
description = "Matching decompilation for x64 MSVC binaries"
requires-python = ">=3.12,<3.13"
dependencies = [
    "iced-x86>=1.21",
    "libclang>=18.1",
    "pyarrow>=17",
]

[project.scripts]
simulacra = "simulacra.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulacra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["clang.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs the msvc-wine toolchain image (deselect with -m 'not docker')",
]
